<svg width="1280" height="820" viewBox="0 0 1280 820" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1280" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFBF2"/>
      <stop offset="1" stop-color="#F4EFE4"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FB923C"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#86EFAC"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C084FC"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#7C2D12" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10" stroke="#A34A24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowSoft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 900 42px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #D9480F; letter-spacing: 1px; }
      .subtitle { font: 600 16px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6B4E35; }
      .layerTitle { font: 800 15px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2F241A; letter-spacing: .2px; }
      .cardTitle { font: 800 12.5px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2F241A; }
      .cardText { font: 600 10px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5C4B3D; }
      .tiny { font: 700 10px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #7C2D12; }
      .note { font: 700 11px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 700 9.5px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #0F766E; }
      .layer { fill: rgba(255,255,255,.45); stroke: #BFA58B; stroke-width: 1.4; stroke-dasharray: 6 5; }
      .card { fill: #FFFDF8; stroke: #9A6B49; stroke-width: 1.5; }
      .center { fill: #FFF7ED; stroke: #C2410C; stroke-width: 3; }
      .flow { stroke: #A34A24; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
      .softFlow { stroke: #64748B; stroke-width: 1.8; fill: none; stroke-dasharray: 5 5; marker-end: url(#arrowSoft); }
    </style>
  </defs>

  <rect width="1280" height="820" fill="#111827"/>
  <rect x="28" y="28" width="1224" height="764" rx="8" fill="url(#paper)"/>
  <circle cx="1170" cy="720" r="18" fill="#FFFFFF" opacity="0.55"/>
  <path d="M1170 682L1176 714L1208 720L1176 726L1170 758L1164 726L1132 720L1164 714L1170 682Z" fill="#FFFFFF" opacity="0.7"/>

  <text x="640" y="88" text-anchor="middle" class="title">MINI CODE AGENT ARCHITECTURE</text>
  <text x="640" y="116" text-anchor="middle" class="subtitle">从最小 Agent loop 出发，逐步叠加工具、上下文、权限、协作、观测与集成能力</text>

  <!-- Layers -->
  <rect x="60" y="150" width="320" height="260" rx="14" class="layer"/>
  <text x="78" y="176" class="layerTitle">INPUT LAYER</text>

  <rect x="410" y="150" width="390" height="198" rx="14" class="layer"/>
