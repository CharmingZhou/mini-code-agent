  <text x="221" y="382" text-anchor="middle" class="cardText" transform="translate(0 20)">deny · allow · approve</text>

  <rect x="94" y="314" width="86" height="26" rx="7" fill="#EA580C" opacity=".9"/>
  <text x="137" y="331" text-anchor="middle" fill="#FFF7ED" font-size="10" font-weight="800">YAML rules</text>

