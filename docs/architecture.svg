  <circle cx="299" cy="678" r="20" fill="#E2E8F0" stroke="#64748B"/><path d="M299 678L311 669M299 678V660" stroke="#334155" stroke-width="3"/>
  <text x="299" y="704" text-anchor="middle" class="cardTitle" transform="translate(0 8)">Background</text>

