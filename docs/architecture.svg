  <rect x="120" y="212" width="42" height="32" rx="4" fill="#1E293B"/>
  <path d="M130 228H153" stroke="#67E8F9" stroke-width="3"/>
  <path d="M128 236L136 228L128 220" stroke="#67E8F9" stroke-width="2" fill="none"/>
