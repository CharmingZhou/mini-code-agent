  <rect x="905" y="150" width="300" height="176" rx="14" class="layer"/>
  <text x="923" y="176" class="layerTitle">INTEGRATION LAYER</text>

  <rect x="760" y="408" width="340" height="178" rx="14" class="layer"/>
  <text x="778" y="434" class="layerTitle">EXECUTION LAYER</text>

  <rect x="1120" y="408" width="118" height="178" rx="14" class="layer"/>
  <text x="1134" y="434" class="layerTitle">OUTPUT</text>

  <rect x="60" y="602" width="320" height="142" rx="14" class="layer"/>
  <text x="78" y="628" class="layerTitle">OBSERVABILITY LAYER</text>

  <rect x="420" y="602" width="650" height="142" rx="14" class="layer"/>
  <text x="438" y="628" class="layerTitle">MULTI-AGENT LAYER</text>

  <!-- Input cards -->
