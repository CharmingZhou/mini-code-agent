  <rect x="434" y="194" width="160" height="70" rx="9" class="card" filter="url(#cardShadow)"/>
  <path d="M452 214H474V250H452C448 250 446 248 446 244V220C446 216 448 214 452 214Z" fill="url(#green)"/>
  <path d="M474 214H496C500 214 502 216 502 220V244C502 248 500 250 496 250H474V214Z" fill="#DCFCE7" stroke="#16A34A"/>
